name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          git diff --exit-code --stat ClipShelf.xcodeproj || \
            (echo "::warning::Committed ClipShelf.xcodeproj differs from regenerated output" && true)

      - name: Build
        run: |
          xcodebuild build \
            -project ClipShelf.xcodeproj \
            -scheme ClipShelf \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project ClipShelf.xcodeproj \
            -scheme ClipShelfTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
